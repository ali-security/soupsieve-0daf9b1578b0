name: deploy

on:
  workflow_dispatch:

jobs:

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Package
        # Release-era index plus an explicit hatchling pin so the wheel's
        # `Generator:` stays hatchling 1.14.0, the backend that built the
        # published 2.4.1 wheel.
        env:
          PIP_INDEX_URL: 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/'
        run: |
          echo 'hatchling==1.14.0' > "${RUNNER_TEMP}/seal-constraints.txt"
          export PIP_CONSTRAINT="${RUNNER_TEMP}/seal-constraints.txt"
          pip install --upgrade build
          python -m build -s -w
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
